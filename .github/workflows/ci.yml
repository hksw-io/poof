name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Check formatting
        run: swift format lint --strict --parallel --recursive Package.swift Sources Tests

      - name: Run debug tests
        run: swift test --parallel

      - name: Build release products
        run: swift build -c release

      - name: Run release tests
        run: swift test -c release --parallel

  platforms:
    name: Build ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - tvOS
          - watchOS
          - visionOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build library
        run: >-
          xcodebuild -quiet
          -scheme Poof
          -destination "generic/platform=${{ matrix.platform }}"
          build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
